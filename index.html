<!DOCTYPE html>
<html>
<head>
  <title>Settings Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Settings Form</h2>
<form id="settingsForm" novalidate>
  <label for="name">Name</label>
  <input type="text" id="name" name="name" placeholder="Name" required minlength="2">
  <span class="field-error" id="nameError"></span><br><br>

  <label for="email">Email</label>
  <input type="email" id="email" name="email" placeholder="Email" required>
  <span class="field-error" id="emailError"></span><br><br>

  <label for="password">Password</label>
  <input type="password" id="password" name="password" placeholder="Password" required minlength="8">
  <span class="field-error" id="passwordError"></span><br><br>

  <button type="submit">Save</button>
</form>

  <p id="error"></p>

  <script src="script.js"></script>
</body>
</html>
